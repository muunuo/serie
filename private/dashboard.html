<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="user.js" defer></script>
    <script src="showapi.js" defer></script>
    <script src="registerShow.js" defer></script>
    <script src="search.js" defer></script>
    <script src="userInput.js" defer></script>
    <link rel="stylesheet" href="dashboard.css">
    <title>Dashboard</title>
</head>
<body>

    <header id="userInfo">
        <!-- filled by user.js -->
        <h3>Welcome, <span id="nickname"></span>!</h3>
        <form action="delete_">
            <button id="deleteButton">Delete account</button>
        </form>
    </header>

    <!-- <form action="/registerSearch">
        <button>Register Show</button>
    </form> -->

    <main id="searchShow_">
        <form id="searchShow_">
            <input type="text" name="showName" id="showName_">
            <button type="submit" id="submitSearch_" >Search</button>
        </form>
        <div id="series"><!-- Gets filled by search.js --></div>
    </main>

    <div id="">
        <form id="registerShow_">
            <label for="status">Choose an option:</label>
            <select id="chooseStatus_" name="status">
                <option value="now">Am Watching</option>
                <option value="have">Have Watched</option>
                <option value="will">To Watch</option>
            </select>
            <input type="text" name="showName" id="userRegisterShow_">
            <button type="submit" id="buttonRegister_" >Register Show</button>
        </form>
    </div>
    
    <!-- <div id="search_"> </div> -->
    <div id="statusSeries"><!-- gets filled by registerShow.js --> </div>
</body>
</html>
